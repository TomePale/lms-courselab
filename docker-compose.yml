services:
  db:
    image: postgres:16
    # Vremena se i dalje spremaju kao UTC (timestamptz); zona određuje
    # samo prikaz, pa ih baza ispisuje po hrvatskom vremenu (+01 / ljeti +02)
    command: ["postgres", "-c", "timezone=Europe/Zagreb"]
    environment:
      POSTGRES_DB: courselab
      POSTGRES_USER: courselab_user
      POSTGRES_PASSWORD: courselab_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: